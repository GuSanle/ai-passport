name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      # Step 1: run checkout with full history to allow merging
      - name: Checkout target repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: fetch and cleanly merge upstream main
      - name: Sync upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/FoloToy/ai-passport.git || true
          git fetch upstream main
          if git merge upstream/main --no-edit -m "chore: auto-sync from upstream"; then
            echo "[Success] Successfully merged upstream changes."
            git push origin main
          else
            echo "[Error] Merge conflict detected with upstream. Please resolve manually."
            exit 1
          fi
