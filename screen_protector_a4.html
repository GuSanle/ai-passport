<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoloToy AI Passport 屏幕贴膜 1:1 打印裁切模板 (A4)</title>
  <style>
    /* 全局重置与排版 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: #0f172a;
      color: #334155;
      line-height: 1.5;
      padding-bottom: 40px;
    }

    /* 顶部非打印控制栏 */
    .no-print-toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 10px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #f8fafc;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .toolbar-title {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: #0284c7;
      color: #ffffff;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
    }
    .notice-chip {
      background: #78350f;
      border: 1px solid #b45309;
      color: #fef3c7;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      border: none;
    }
    .btn-print {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-print:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    /* 自定义尺寸微调面板 (非打印) */
    .custom-panel {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 10px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      color: #cbd5e1;
      font-size: 13px;
    }
    .input-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .input-group label {
      color: #94a3b8;
    }
    .input-group input {
      width: 65px;
      padding: 4px 8px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #f8fafc;
      font-size: 13px;
      font-family: monospace;
    }

    /* A4 页面容器 */
    .page-container {
      display: flex;
      justify-content: center;
      padding: 24px 0;
    }
    .a4-sheet {
      width: 210mm;
      min-height: 297mm;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      padding: 8mm 10mm 6mm 10mm;
      box-sizing: border-box;
      position: relative;
    }

    .sheet-svg {
      width: 190mm;
      height: 279mm;
      display: block;
    }

    /* 打印核心规则：严格 1:1，移除网页杂项 */
    @page {
      size: A4 portrait;
      margin: 10mm;
    }
    @media print {
      body {
        background: transparent !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .page-container {
        padding: 0 !important;
        margin: 0 !important;
      }
      .a4-sheet {
        width: 190mm !important;
        height: 277mm !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .sheet-svg {
        width: 190mm !important;
        height: 277mm !important;
      }
    }
  </style>

      <div class="notice-chip">
        ⚠️ 打印关键点：打印窗口中【缩放比例】必须为 100%（实际大小），切勿勾选“适应纸张/缩放以适合”！

    </div>
    <div class="toolbar-right">

    <div class="input-group">
      <label>宽 (mm):</label>
      <input type="number" id="inp-w" value="30.60" step="0.1" min="10" max="60" oninput="updateCustomBox()">

    <div class="input-group">
      <label>高 (mm):</label>
      <input type="number" id="inp-h" value="40.80" step="0.1" min="10" max="80" oninput="updateCustomBox()">

    <div class="input-group">
      <label>圆角 R (mm):</label>
      <input type="number" id="inp-r" value="2.5" step="0.1" min="0" max="15" oninput="updateCustomBox()">
    </div>
    <span style="font-size:12px; color:#94a3b8;">（可在方案三【实时自定义框】中预览并直接打印）</span>

  <!-- 网页端动态微调逻辑 -->
  <script>
    function updateCustomBox() {
      const w = parseFloat(document.getElementById('inp-w').value) || 30.60;
      const h = parseFloat(document.getElementById('inp-h').value) || 40.80;
      const r = parseFloat(document.getElementById('inp-r').value) || 2.5;

      const rect = document.getElementById('custom-rect');
      rect.setAttribute('width', w.toFixed(2));
      rect.setAttribute('height', h.toFixed(2));
      rect.setAttribute('rx', r.toFixed(2));
      rect.setAttribute('ry', r.toFixed(2));

      // Guide lines
      const ext = 3.0;
      document.getElementById('c-guide-t1').setAttribute('x2', r.toFixed(2));
      document.getElementById('c-guide-t2').setAttribute('x1', (w - r).toFixed(2));
      document.getElementById('c-guide-t2').setAttribute('x2', (w + ext).toFixed(2));

      document.getElementById('c-guide-b1').setAttribute('y1', h.toFixed(2));
      document.getElementById('c-guide-b1').setAttribute('y2', h.toFixed(2));
      document.getElementById('c-guide-b1').setAttribute('x2', r.toFixed(2));
      document.getElementById('c-guide-b2').setAttribute('y1', h.toFixed(2));
      document.getElementById('c-guide-b2').setAttribute('y2', h.toFixed(2));
      document.getElementById('c-guide-b2').setAttribute('x1', (w - r).toFixed(2));
      document.getElementById('c-guide-b2').setAttribute('x2', (w + ext).toFixed(2));

      document.getElementById('c-guide-l1').setAttribute('y2', r.toFixed(2));
      document.getElementById('c-guide-l2').setAttribute('y1', (h - r).toFixed(2));
      document.getElementById('c-guide-l2').setAttribute('y2', (h + ext).toFixed(2));

      document.getElementById('c-guide-r1').setAttribute('x1', w.toFixed(2));
      document.getElementById('c-guide-r1').setAttribute('x2', w.toFixed(2));
      document.getElementById('c-guide-r1').setAttribute('y2', r.toFixed(2));
      document.getElementById('c-guide-r2').setAttribute('x1', w.toFixed(2));
      document.getElementById('c-guide-r2').setAttribute('x2', w.toFixed(2));
      document.getElementById('c-guide-r2').setAttribute('y1', (h - r).toFixed(2));
      document.getElementById('c-guide-r2').setAttribute('y2', (h + ext).toFixed(2));

      // Crosshair
      const cx = w / 2;
      const cy = h / 2;
      document.getElementById('c-cross-h').setAttribute('x1', (cx - 3.0).toFixed(2));
      document.getElementById('c-cross-h').setAttribute('x2', (cx + 3.0).toFixed(2));
      document.getElementById('c-cross-h').setAttribute('y1', cy.toFixed(2));
      document.getElementById('c-cross-h').setAttribute('y2', cy.toFixed(2));

      document.getElementById('c-cross-v').setAttribute('x1', cx.toFixed(2));
      document.getElementById('c-cross-v').setAttribute('x2', cx.toFixed(2));
      document.getElementById('c-cross-v').setAttribute('y1', (cy - 3.0).toFixed(2));
      document.getElementById('c-cross-v').setAttribute('y2', (cy + 3.0).toFixed(2));

      // Dim texts
      document.getElementById('custom-dim-text').textContent = `${w.toFixed(2)} × ${h.toFixed(2)} mm`;
      document.getElementById('custom-r-text').textContent = `圆角 R=${r.toFixed(1)}mm (实时微调)`;
    }
  </script>
